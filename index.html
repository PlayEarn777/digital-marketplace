<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#0a0d16" />
<title>Wholesale Market Worldwide</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#080a11; --bg2:#0e1120; --card:#131829; --card2:#1a2036;
  --line:rgba(255,255,255,.08); --txt:#eef1f8; --dim:#8d95ad;
  --gold:#f5c451; --gold2:#c9962c; --ok:#3ddc97; --bad:#ff5d6c;
  --r:18px; --shadow:0 18px 50px rgba(0,0,0,.55);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  overscroll-behavior-y:none}
body{min-height:100vh;background:
  radial-gradient(900px 500px at 80% -10%,rgba(245,196,81,.12),transparent 60%),
  radial-gradient(700px 400px at -10% 10%,rgba(90,120,255,.14),transparent 60%),
  var(--bg)}
img{display:block;max-width:100%}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font:inherit;color:var(--txt);background:var(--card2);
  border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%;outline:none}
input:focus,textarea:focus,select:focus{border-color:rgba(245,196,81,.55)}
::-webkit-scrollbar{width:0}
.hide{display:none!important}
#app{max-width:560px;margin:0 auto;padding-bottom:96px}
header{position:sticky;top:0;z-index:40;padding:12px 16px 10px;display:flex;
  align-items:center;gap:10px;backdrop-filter:blur(18px);
  background:linear-gradient(180deg,rgba(8,10,17,.96),rgba(8,10,17,.72));
  border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;flex:1;min-width:0}
.logo{width:36px;height:36px;border-radius:11px;flex:0 0 auto;
  background:linear-gradient(145deg,var(--gold),var(--gold2));display:grid;place-items:center;
  font-weight:800;color:#20180a;font-size:17px;box-shadow:0 6px 18px rgba(245,196,81,.3)}
.bname{font-weight:800;font-size:14px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.verified{display:inline-flex;align-items:center;gap:4px;font-size:10px;color:#7fe7ff;font-weight:700}
.balchip{display:flex;align-items:center;gap:6px;background:rgba(61,220,151,.12);
  border:1px solid rgba(61,220,151,.28);color:var(--ok);padding:7px 11px;border-radius:999px;
  font-size:12.5px;font-weight:800;white-space:nowrap;transition:transform .15s}
.balchip:active{transform:scale(.94)}
.icobtn{width:36px;height:36px;border-radius:11px;background:var(--card);border:1px solid var(--line);
  display:grid;place-items:center;font-size:14px;font-weight:800;transition:transform .15s,background .2s}
.icobtn:active{transform:scale(.9);background:var(--card2)}
.pad{padding:0 16px}
.sec{margin:20px 0 8px;display:flex;align-items:center;justify-content:space-between}
.sec h2{font-size:15px;margin:0;letter-spacing:.2px}
.sec .more{font-size:12px;color:var(--gold);font-weight:700}
.muted{color:var(--dim);font-size:12.5px;line-height:1.55}
.card{background:linear-gradient(160deg,var(--card),var(--card2));border:1px solid var(--line);
  border-radius:var(--r);box-shadow:var(--shadow)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;
  border-radius:14px;font-weight:800;font-size:14.5px;transition:transform .14s,filter .2s;
  background:linear-gradient(145deg,var(--gold),var(--gold2));color:#1a1305;
  box-shadow:0 12px 28px rgba(245,196,81,.24)}
.btn:active{transform:scale(.97);filter:brightness(1.06)}
.btn.ghost{background:var(--card2);color:var(--txt);border:1px solid var(--line);box-shadow:none}
.btn.dark{background:#0b0e18;border:1px solid var(--line);color:var(--txt);box-shadow:none}
.btn.sm{padding:10px 14px;font-size:13px;width:auto;border-radius:11px}
.btn[disabled]{opacity:.5;pointer-events:none}
.row{display:flex;gap:10px;align-items:center}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chip{padding:8px 13px;border-radius:999px;background:var(--card);border:1px solid var(--line);
  font-size:12.5px;font-weight:700;white-space:nowrap;transition:.18s}
.chip.on{background:linear-gradient(145deg,var(--gold),var(--gold2));color:#1a1305;border-color:transparent}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 2px;margin:0 -16px}
.badge{font-size:10px;font-weight:800;padding:4px 8px;border-radius:8px;
  background:rgba(245,196,81,.14);color:var(--gold);text-transform:uppercase;letter-spacing:.4px}
.badge.ok{background:rgba(61,220,151,.14);color:var(--ok)}
.badge.bad{background:rgba(255,93,108,.14);color:var(--bad)}
.hero{margin:14px 16px 0;padding:20px;border-radius:22px;position:relative;overflow:hidden;
  background:linear-gradient(140deg,#191f36,#0f1424 60%);border:1px solid var(--line);box-shadow:var(--shadow)}
.hero:before{content:"";position:absolute;inset:-40% -20% auto auto;width:260px;height:260px;
  background:radial-gradient(circle,rgba(245,196,81,.35),transparent 65%);filter:blur(6px);
  animation:float 7s ease-in-out infinite}
@keyframes float{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(-14px,12px,0) scale(1.12)}}
.hero h1{margin:8px 0 6px;font-size:22px;line-height:1.2;position:relative}
.hero p{margin:0 0 16px;font-size:12.5px;color:var(--dim);line-height:1.6;position:relative;max-width:80%}
.hero .btn{position:relative;max-width:220px}
.spot{margin:10px 16px 0;border-radius:20px;overflow:hidden;border:1px solid var(--line);
  background:linear-gradient(140deg,#141a2c,#0d1120);box-shadow:var(--shadow);position:relative}
.spot .media{height:150px;background-size:cover;background-position:center;position:relative;
  display:grid;place-items:center;font-size:52px}
.spot .media:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 20%,rgba(8,10,17,.92))}
.spot .body{padding:14px 16px 16px;position:relative}
.spot .body h3{margin:0 0 6px;font-size:16px}
.spot .bar{height:3px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden;margin-top:12px}
.spot .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--gold2));
  animation:grow 300s linear forwards}
@keyframes grow{to{width:100%}}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px}
.cat{padding:14px;border-radius:16px;border:1px solid var(--line);background:linear-gradient(150deg,var(--card),var(--card2));
  transition:transform .16s,box-shadow .2s;position:relative;overflow:hidden}
.cat:active{transform:scale(.965);box-shadow:0 10px 26px rgba(0,0,0,.5)}
.cat .ico{font-size:24px;margin-bottom:8px}
.cat b{display:block;font-size:13.5px;line-height:1.3}
.cat span{font-size:11.5px;color:var(--dim)}
.cat .glow{position:absolute;width:90px;height:90px;right:-30px;top:-30px;border-radius:50%;
  background:radial-gradient(circle,rgba(245,196,81,.22),transparent 70%)}
.prods{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px}
.prod{border-radius:16px;overflow:hidden;background:linear-gradient(160deg,var(--card),var(--card2));
  border:1px solid var(--line);transition:transform .16s;position:relative}
.prod:active{transform:scale(.965)}
.prod .img{height:104px;background:linear-gradient(140deg,#1b2238,#121729);display:grid;place-items:center;
  font-size:34px;background-size:cover;background-position:center}
.prod .in{padding:10px 11px 12px}
.prod b{font-size:12.5px;line-height:1.35;margin-bottom:6px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:34px}
.prod .price{font-size:14px;font-weight:800;color:var(--gold)}
.prod .sub{font-size:10.5px;color:var(--dim);margin-top:3px}
.tag{position:absolute;top:8px;left:8px;font-size:9.5px;font-weight:800;padding:3px 7px;border-radius:7px;
  background:rgba(8,10,17,.72);backdrop-filter:blur(6px);color:var(--gold);border:1px solid rgba(245,196,81,.3)}
.rowcard{display:flex;gap:12px;align-items:center;padding:13px 14px;border-radius:15px;
  background:var(--card);border:1px solid var(--line);margin-bottom:10px;transition:transform .15s}
.rowcard:active{transform:scale(.98)}
.rowcard .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:18px;
  background:var(--card2);border:1px solid var(--line);flex:0 0 auto}
.rowcard .grow{flex:1;min-width:0}
.rowcard b{font-size:13.5px;display:block}
.rowcard small{color:var(--dim);font-size:11.5px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:50;display:flex;justify-content:space-around;
  padding:8px 6px calc(8px + env(safe-area-inset-bottom));background:rgba(10,13,22,.94);
  backdrop-filter:blur(20px);border-top:1px solid var(--line)}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:9.5px;
  color:var(--dim);font-weight:700;padding:6px 0;transition:.18s}
nav button .e{font-size:19px;line-height:1;transition:transform .18s}
nav button.on{color:var(--gold)}
nav button.on .e{transform:translateY(-2px) scale(1.12)}
nav button:active .e{transform:scale(.86)}
.mask{position:fixed;inset:0;background:rgba(3,5,10,.72);backdrop-filter:blur(6px);z-index:60;
  opacity:0;pointer-events:none;transition:opacity .25s}
.mask.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;max-height:92vh;overflow-y:auto;
  background:linear-gradient(180deg,#121728,#0a0d16);border-top-left-radius:24px;border-top-right-radius:24px;
  border-top:1px solid var(--line);transform:translateY(102%);transition:transform .32s cubic-bezier(.2,.9,.2,1);
  padding:8px 16px calc(24px + env(safe-area-inset-bottom))}
.sheet.on{transform:translateY(0)}
.grab{width:42px;height:4px;border-radius:4px;background:rgba(255,255,255,.18);margin:6px auto 14px}
.toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,20px);z-index:80;opacity:0;
  background:#1b2236;border:1px solid var(--line);color:var(--txt);padding:11px 16px;border-radius:12px;
  font-size:13px;font-weight:600;box-shadow:var(--shadow);transition:.25s;max-width:88%;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.qty{display:flex;align-items:center;gap:14px;justify-content:center;background:var(--card2);
  border:1px solid var(--line);border-radius:14px;padding:8px 12px;width:max-content;margin:0 auto}
.qty button{width:34px;height:34px;border-radius:10px;background:var(--card);font-size:19px;font-weight:700}
.qty span{font-size:17px;font-weight:800;min-width:36px;text-align:center}
.steps li{margin-bottom:8px}
.field{margin-bottom:12px}
.field label{display:block;font-size:11.5px;color:var(--dim);margin-bottom:6px;font-weight:700}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:0 16px;margin:12px -16px}
.tab{padding:9px 14px;border-radius:11px;background:var(--card);border:1px solid var(--line);
  font-size:12.5px;font-weight:700;white-space:nowrap}
.tab.on{background:linear-gradient(145deg,var(--gold),var(--gold2));color:#1a1305;border-color:transparent}
.fadein{animation:fade .35s ease both}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.why{display:grid;gap:10px;padding:0 16px}
.why .it{display:flex;gap:12px;padding:13px;border-radius:15px;background:var(--card);border:1px solid var(--line)}
.why .n{width:26px;height:26px;border-radius:8px;background:rgba(245,196,81,.14);color:var(--gold);
  font-size:12px;font-weight:800;display:grid;place-items:center;flex:0 0 auto}
video,.vph{width:100%;border-radius:16px;border:1px solid var(--line);background:#000}
.vph{height:170px;display:grid;place-items:center;background:linear-gradient(140deg,#161d31,#0c101c);
  color:var(--dim);font-size:12.5px;text-align:center;padding:20px}
.foot{text-align:center;color:var(--dim);font-size:11px;padding:22px 16px 10px;line-height:1.7}
.copy{display:flex;gap:8px;align-items:center;justify-content:space-between;background:var(--card2);
  border:1px dashed rgba(245,196,81,.4);border-radius:12px;padding:11px 13px;
  font-family:ui-monospace,monospace;font-size:12px;letter-spacing:.4px;overflow:hidden}
.prog{height:5px;background:rgba(255,255,255,.08);border-radius:5px;overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2))}
.empty{text-align:center;padding:40px 20px;color:var(--dim);font-size:13px}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <div class="logo">W</div>
      <div style="min-width:0">
        <div class="bname" id="brandName">Wholesale Market</div>
        <div class="verified">&#10004; <span data-i18n="verified">Verified Worldwide</span></div>
      </div>
    </div>
    <button class="balchip" onclick="go('wallet')">$<span id="balVal">0.00</span></button>
    <button class="icobtn" id="langBtn" onclick="toggleLang()">EN</button>
  </header>
  <main id="view"></main>
  <nav id="nav"></nav>
</div>
<div class="mask" id="mask" onclick="closeSheet()"></div>
<div class="sheet" id="sheet"><div class="grab"></div><div id="sheetBody"></div></div>
<div class="toast" id="toast"></div>
<script>
/* WHOLESALE MARKET WORLDWIDE - mini app (single file)
   Runs on GitHub Pages with no server: data lives in the browser.
   To go live, set API_BASE and replace the API functions with fetch calls. */

var I18N = {

    items:"টি আইটেম", whybuy:"কেন এখান থেকে কিনবেন", howto:"কীভাবে কিনবেন", about:"আমাদের সম্পর্কে",

    balance:"ব্যালেন্স", addfunds:"ব্যালেন্স যোগ", withdraw:"উত্তোলন", deposit:"ডিপোজিট",
    history:"হিস্টোরি", signin:"লগইন", signup:"অ্যাকাউন্ট খুলুন", logout:"লগআউট",
    forgot:"পাসওয়ার্ড ভুলেছেন?", email:"ইমেইল", username:"ইউজারনেম", password:"পাসওয়ার্ড",
    orderplaced:"অর্ডার সফল হয়েছে", orderid:"অর্ডার আইডি", supportslow:"দেরি হচ্ছে? সাপোর্টে যোগাযোগ করুন",
    copy:"কপি", copied:"কপি হয়েছে", refer:"রেফার করে আয় করুন", referral:"রেফারেল",
    depositmethods:"ডিপোজিট পদ্ধতি", uploadproof:"পেমেন্ট প্রুফ আপলোড", send:"পাঠান",
    admin:"অ্যাডমিন", settings:"সেটিংস", users:"ইউজার", products:"পণ্য",
    categories:"ক্যাটাগরি", deposits:"ডিপোজিট", referralfirst:"প্রথম রিচার্জ বোনাস",
    markup:"আপনার মার্কআপ %", resell:"রিসেলার মোড", lang:"ভাষা"
  }
};
var LANG = localStorage.getItem("wm_lang") || "en";
function t(k){ return (I18N[LANG] && I18N[LANG][k]) || I18N.en[k] || k; }
function toggleLang(){
  LANG = LANG === "en" ? "bn" : "en";
  localStorage.setItem("wm_lang", LANG);
  document.getElementById("langBtn").textContent = LANG.toUpperCase();
  render();
}

var TG = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
if (TG){ try{ TG.ready(); TG.expand(); TG.setHeaderColor("#0a0d16"); }catch(e){} }
var tgUser = (TG && TG.initDataUnsafe && TG.initDataUnsafe.user) ? TG.initDataUnsafe.user : null;

function $(s){ return document.querySelector(s); }
function money(n){ return "$" + (Math.round((Number(n)||0)*100)/100).toFixed(2); }
function esc(s){
  return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function oid(){ return "WM" + Date.now().toString(36).toUpperCase().slice(-6) + Math.floor(Math.random()*900+100); }
function dstr(ts){
  try{ return new Date(ts).toLocaleString(undefined,{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"}); }
  catch(e){ return ""; }
}
function toast(m){
  var el = $("#toast"); el.textContent = m; el.classList.add("on");
  clearTimeout(el._t); el._t = setTimeout(function(){ el.classList.remove("on"); }, 1900);
}
function copyTxt(s){
  try{ navigator.clipboard.writeText(s); toast(t("copied")); }catch(e){ toast(s); }
}
function ripple(){
  if (!TG || !TG.HapticFeedback) return;
  try{ TG.HapticFeedback.impactOccurred("light"); }catch(e){}
}
var DB = {
  get: function(k, d){
    try{ var v = localStorage.getItem("wm_"+k); return v ? JSON.parse(v) : d; }catch(e){ return d; }
  },
  set: function(k, v){ localStorage.setItem("wm_"+k, JSON.stringify(v)); }
};

function seed(){
  if (DB.get("seeded")) return;
  DB.set("cats", [
    {id:"c1", name:"Telegram Accounts", icon:"✈️", subs:[]},
    {id:"c2", name:"Subscriptions", icon:"🎬", subs:[{id:"s1",name:"Streaming"},{id:"s2",name:"Software"}]},
    {id:"c3", name:"Software and Keys", icon:"🗝", subs:[]},
    {id:"c4", name:"Social Media", icon:"📣", subs:[]},
    {id:"c5", name:"Data and Leads", icon:"📊", subs:[]},
    {id:"c6", name:"Gift Cards", icon:"🎁", subs:[]}
  ]);
  DB.set("prods", [
    {id:"p1", cat:"c1", sub:"", name:"Telegram aged account - 6 months", desc:"Verified aged account, phone-unlinked, instant delivery of credentials.", price:1.00, stock:120, sold:284, icon:"✈️", img:"", hot:true},
    {id:"p2", cat:"c2", sub:"s1", name:"Netflix Premium 1 month", desc:"4K UHD, 1 profile, full warranty for the whole period.", price:3.50, stock:64, sold:512, icon:"🎬", img:"", hot:true},
    {id:"p3", cat:"c3", sub:"", name:"Windows 11 Pro Retail Key", desc:"Lifetime retail key, activates online, one PC.", price:6.00, stock:38, sold:197, icon:"🖥", img:""},
    {id:"p4", cat:"c4", sub:"", name:"Instagram 5k followers", desc:"Real-looking supply, drip feed over 7 days, refill guarantee.", price:4.20, stock:300, sold:88, icon:"📸", img:""},
    {id:"p5", cat:"c5", sub:"", name:"B2B email list - 10k verified", desc:"Cleaned and verified business emails, CSV delivery.", price:9.00, stock:12, sold:34, icon:"📊", img:""},

  clearInterval(spotTimer);

  var p = null, prods = API.prods();

  if (!p) return;
  QTY = Math.max(1, Math.min(p.stock || 1, QTY + d));

  $("#totVal").textContent = money(priceFor(p) * QTY);

function buy(pid){
  var prods = API.prods(), p = null;
  for (var i=0;i<prods.length;i++){ if (prods[i].id === pid) p = prods[i]; }
  if (!p) return;
  if (!ME){ toast(LANG==="bn"?"আগে লগইন করুন":"Please sign in first"); go("profile"); return; }
  var total = Math.round(priceFor(p) * QTY * 100) / 100;
  if (ME.balance < total){ toast(LANG==="bn"?"ব্যালেন্স যথেষ্ট নয়":"Not enough balance"); go("wallet"); return; }
  if (p.stock < QTY){ toast(LANG==="bn"?"স্টক যথেষ্ট নয়":"Not enough stock"); return; }
  ME.balance = Math.round((ME.balance - total)*100)/100;
  API.updateUser(ME);
  var order = {id:oid(), uid:ME.id, uname:ME.username, pid:p.id, pname:p.name,
    qty:QTY, price:priceFor(p), total:total, status:"processing", created:Date.now()};
  var orders = API.orders(); orders.unshift(order); DB.set("orders", orders);
  var all = API.prods();
  for (var k=0;k<all.length;k++){
    if (all[k].id === p.id){ all[k].stock = all[k].stock - QTY; all[k].sold = all[k].sold + QTY; }
  }
  DB.set("prods", all); refreshMe();
  openSheet('<h2 style="margin:6px 0 10px;font-size:17px">&#9989; '+t("orderplaced")+'</h2>'+
    '<p class="muted">'+(LANG==="bn"?"আপনার অর্ডার প্রসেস হচ্ছে। প্রস্তুত হলে জানানো হবে।":"Your order is being processed. You will be notified when it is ready.")+'</p>'+

    '<div class="copy"><span>'+order.id+'</span><button class="btn sm" onclick="copyTxt(\''+order.id+'\')">'+t("copy")+'</button></div></div>'+
    '<div class="card" style="padding:12px;margin:12px 0"><b style="font-size:13px">'+esc(p.name)+'</b>'+
    '<div class="muted">'+QTY+' x '+money(order.price)+' = <b style="color:var(--gold)">'+money(order.total)+'</b></div>'+
    '<div class="prog"><i style="width:45%"></i></div></div>'+
    '<p class="muted">'+t("supportslow")+'</p>'+
    '<button class="btn ghost" onclick="closeSheet();go(\'support\')">💬 '+t("support")+'</button>'+
    '<button class="btn" style="margin-top:10px" onclick="closeSheet();go(\'orders\')">📦 '+t("orders")+'</button>');
  go("product", pid);

      method:"USDT TRC20 / Bank", proof:proof||"", status:"pending", created:Date.now()});

function viewAdmin(){
  if (!ME || !roleIsAdmin(ME.role)) return '<div class="empty">Admins only</div>';
  var h = '<div class="sec pad" style="margin-top:16px"><h2>⚙️ '+t("admin")+'</h2></div>';
  var all = [["products","products","📦 "+t("products")],["cats","cats","🗂 "+t("categories")],
             ["users","users","👥 "+t("users")],["orders","orders","🧾 "+t("orders")],
             ["deps","deposits","💰 "+t("deposits")],["wd","withdraw","↑ "+t("withdraw")],
             ["tickets","support","💬 "+t("support")],["set","settings","⚙️ "+t("settings")]];
  var tabs = [];
  for (var a=0;a<all.length;a++){ if (can(all[a][1])) tabs.push(all[a]); }
  if (!tabs.length) return '<div class="empty">No admin access. Ask the owner for a section.</div>';
  var found = false;
  for (var f=0;f<tabs.length;f++){ if (tabs[f][0] === ATAB) found = true; }
  if (!found) ATAB = tabs[0][0];
  h += '<div class="tabs">';
  for (var i=0;i<tabs.length;i++){
    h += '<button class="tab '+(ATAB===tabs[i][0]?"on":"")+'" onclick="ATAB=\''+tabs[i][0]+'\';render()">'+tabs[i][1]+'</button>';
  }
  h += '</div><div class="pad">';
  if (ATAB==="products") h += adminProducts();
  if (ATAB==="cats") h += adminCats();
  if (ATAB==="users") h += adminUsers();
  if (ATAB==="orders") h += adminOrders();
  if (ATAB==="deps") h += adminDeps();
  if (ATAB==="wd") h += adminWd();
  if (ATAB==="tickets") h += adminTickets();
  if (ATAB==="set") h += adminSet();
  return h + '</div>';
}
function adminProducts(){
  var ps = API.prods();
  var h = '<div class="row" style="margin-bottom:12px"><button class="btn sm" onclick="editProd()">＋ New product</button></div>';
  for (var i=0;i<ps.length;i++){
    var p = ps[i];
    h += '<div class="rowcard"><div class="ic">'+esc(p.icon||"📦")+'</div><div class="grow">'+
      '<b>'+esc(p.name)+'</b><small>'+money(p.price)+' · stock '+p.stock+'</small></div>'+
      '<button class="btn sm ghost" onclick="editProd(\''+p.id+'\')">Edit</button></div>';
  }
  return h;
}
function editProd(id){
  var p = {id:"p"+Date.now(), cat:"", sub:"", name:"", desc:"", price:1, stock:10, sold:0, icon:"📦", img:""};
  var ps = API.prods();
  for (var i=0;i<ps.length;i++){ if (ps[i].id === id) p = ps[i]; }
  var cats = API.cats(), opts = "";
  for (var c=0;c<cats.length;c++){
    opts += '<option value="'+cats[c].id+'" '+(p.cat===cats[c].id?"selected":"")+'>'+esc(cats[c].name)+'</option>';
  }
  openSheet('<h2 style="margin:6px 0 10px;font-size:17px">'+(id?"Edit":"New")+' product</h2>'+
    '<div class="field"><label>Name</label><input id="pN" value="'+esc(p.name)+'"></div>'+
    '<div class="field"><label>Description</label><textarea id="pD" rows="3">'+esc(p.desc||"")+'</textarea></div>'+
    '<div class="field"><label>Price USD</label><input id="pP" type="number" step="0.01" value="'+(p.price||0)+'"></div>'+
    '<div class="field"><label>Stock</label><input id="pS" type="number" value="'+(p.stock||0)+'"></div>'+
    '<div class="field"><label>Category</label><select id="pC">'+opts+'</select></div>'+
    '<div class="field"><label>Icon (emoji)</label><input id="pI" value="'+esc(p.icon||"📦")+'"></div>'+
    '<div class="field"><label>Image URL (optional)</label><input id="pImg" value="'+esc(p.img||"")+'"></div>'+
    '<button class="btn" onclick="saveProd(\''+p.id+'\','+(id?"1":"0")+')">Save</button>'+
    (id?'<button class="btn dark" style="margin-top:8px" onclick="delProd(\''+p.id+'\')">Delete</button>':""));
}
function saveProd(id, exists){
  var p = {id:id, cat:$("#pC").value, sub:"", name:$("#pN").value.trim(), desc:$("#pD").value.trim(),
    price:Number($("#pP").value||0), stock:Number($("#pS").value||0), icon:$("#pI").value.trim(),
    img:$("#pImg").value.trim(), sold:0};
  if (!p.name){ toast("Name required"); return; }
  var all = API.prods();
  for (var i=0;i<all.length;i++){ if (all[i].id === id){ p.sold = all[i].sold || 0; } }
  if (exists){
    for (var j=0;j<all.length;j++){ if (all[j].id === id) all[j] = p; }
  } else { all.push(p); }
  DB.set("prods", all); closeSheet(); toast("Saved"); render();
}
function delProd(id){
  var all = API.prods(), out = [];
  for (var i=0;i<all.length;i++){ if (all[i].id !== id) out.push(all[i]); }
  DB.set("prods", out); closeSheet(); toast("Deleted"); render();
}

function adminCats(){
  var cats = API.cats(), prods = API.prods();
  var h = '<div class="row" style="margin-bottom:12px"><button class="btn sm" onclick="editCat()">＋ New category</button></div>';
  for (var i=0;i<cats.length;i++){
    var c = cats[i], n = 0;
    for (var p=0;p<prods.length;p++){ if (prods[p].cat === c.id) n++; }
    h += '<div class="rowcard"><div class="ic">'+esc(c.icon||"📦")+'</div><div class="grow">'+
      '<b>'+esc(c.name)+'</b><small>'+n+' products · '+((c.subs||[]).length)+' subcategories</small></div>'+
      '<button class="btn sm ghost" onclick="editCat(\''+c.id+'\')">Edit</button></div>';
  }
  return h;
}
function editCat(id){
  var c = {id:"c"+Date.now(), name:"", icon:"📦", subs:[]};
  var cats = API.cats();
  for (var i=0;i<cats.length;i++){ if (cats[i].id === id) c = cats[i]; }
  var subsStr = [];
  for (var s=0;s<(c.subs||[]).length;s++) subsStr.push(c.subs[s].name);
  openSheet('<h2 style="margin:6px 0 10px;font-size:17px">'+(id?"Edit":"New")+' category</h2>'+
    '<div class="field"><label>Name</label><input id="cN" value="'+esc(c.name)+'"></div>'+
    '<div class="field"><label>Icon (emoji)</label><input id="cI" value="'+esc(c.icon||"📦")+'"></div>'+
    '<div class="field"><label>Subcategories (comma separated)</label><input id="cS" value="'+esc(subsStr.join(", "))+'"></div>'+
    '<button class="btn" onclick="saveCat(\''+c.id+'\','+(id?"1":"0")+')">Save</button>'+
    (id?'<button class="btn dark" style="margin-top:8px" onclick="delCat(\''+c.id+'\')">Delete</button>':""));
}
function saveCat(id, exists){
  var raw = ($("#cS").value || "").split(","), subs = [];
  for (var i=0;i<raw.length;i++){
    var nm = raw[i].trim();
    if (nm) subs.push({id:"s"+i+"_"+id, name:nm});
  }
  var c = {id:id, name:$("#cN").value.trim(), icon:$("#cI").value.trim(), subs:subs};
  if (!c.name){ toast("Name required"); return; }
  var all = API.cats();
  if (exists){ for (var j=0;j<all.length;j++){ if (all[j].id === id) all[j] = c; } }
  else { all.push(c); }
  DB.set("cats", all); closeSheet(); toast("Saved"); render();
}
function delCat(id){
  var all = API.cats(), out = [];
  for (var i=0;i<all.length;i++){ if (all[i].id !== id) out.push(all[i]); }
  DB.set("cats", out); closeSheet(); toast("Deleted"); render();
}

function adminUsers(){
  var us = API.users(), h = "";
  for (var i=0;i<Math.min(us.length,50);i++){
    var u = us[i];
    var ic = u.role==="main" ? "👑" : (u.role==="equal" ? "🟡" : (u.role==="sub" ? "🔵" : (u.role==="reseller" ? "🏷" : "👤")));
    h += '<div class="rowcard"><div class="ic">'+ic+'</div><div class="grow">'+
      '<b>'+esc(u.username)+'</b><small>'+money(u.balance)+' · '+esc(u.email||"")+' · '+esc(u.role)+'</small></div>'+
      '<button class="btn sm ghost" onclick="editUser(\''+u.id+'\')">Manage</button></div>';
  }
  return h;
}
function permToggle(){
  var sel = $("#uR"), wrap = $("#permWrap");
  if (!sel || !wrap) return;
  if (sel.value === "sub") wrap.classList.remove("hide");
  else wrap.classList.add("hide");
}
function editUser(id){
  var u = null, us = API.users();
  for (var i=0;i<us.length;i++){ if (us[i].id === id) u = us[i]; }
  if (!u) return;
  openSheet('<h2 style="margin:6px 0 10px;font-size:17px">'+esc(u.username)+'</h2>'+
    '<div class="field"><label>Username</label><input id="uN" value="'+esc(u.username)+'"></div>'+
    '<div class="field"><label>Email</label><input id="uE" value="'+esc(u.email||"")+'"></div>'+
    '<div class="field"><label>New password (blank = keep)</label><input id="uP"></div>'+
    '<div class="field"><label>Balance</label><input id="uB" type="number" step="0.01" value="'+(u.balance||0)+'"></div>'+
    '<div class="field"><label>Role</label><select id="uR" onchange="permToggle()">'+
      '<option value="user" '+(u.role==="user"?"selected":"")+'>user</option>'+
      '<option value="reseller" '+(u.role==="reseller"?"selected":"")+'>reseller</option>'+
      '<option value="sub" '+(u.role==="sub"?"selected":"")+'>sub admin</option>'+
      '<option value="equal" '+(u.role==="equal"?"selected":"")+'>equal admin</option>'+
      '<option value="main" '+(u.role==="main"?"selected":"")+'>main admin</option></select></div>'+
    '<div class="field hide" id="permWrap"><label>Sub admin sections (comma separated)</label>'+
    '<input id="uPerms" value="'+esc((u.perms||[]).join(", "))+'" placeholder="products, orders, support"></div>'+
    '<div class="muted" style="margin-bottom:10px">Sections: products, cats, users, orders, deposits, withdraw, support, settings, broadcast, appfile, ads</div>'+
    '<button class="btn" onclick="saveUser(\''+u.id+'\')">Save</button>'+
    '<div class="field" style="margin-top:14px"><label>Message this user</label><textarea id="uM" rows="2"></textarea></div>'+
    '<button class="btn ghost" onclick="dmUser(\''+u.id+'\')">Send message</button>');
  permToggle();
}
function saveUser(id){
  var us = API.users(), u = null;
  for (var i=0;i<us.length;i++){ if (us[i].id === id) u = us[i]; }
  if (!u) return;
  u.username = $("#uN").value.trim() || u.username;
  u.email = $("#uE").value.trim();
  if ($("#uP").value) u.password = $("#uP").value;
  u.balance = Number($("#uB").value || 0);
  var want = $("#uR").value;
  // only a main admin may hand out main or equal access
  if ((want === "main" || want === "equal") && ME.role !== "main"){
    toast("Only the main admin can grant full access");
    want = u.role;
  }
  u.role = want;
  if (want === "sub"){
    var raw = ($("#uPerms") ? $("#uPerms").value : "").split(","), ps = [];
    for (var i=0;i<raw.length;i++){
      var nm = raw[i].trim().toLowerCase();
      if (nm) ps.push(nm);
    }
    u.perms = ps;
  } else { u.perms = []; }
  if (want !== "reseller" && want !== "sub" && want !== "equal" && want !== "main") u.markup = 0;
  API.updateUser(u); closeSheet(); toast("Saved"); render();
}
function dmUser(id){
  var txt = $("#uM").value.trim();
  if (!txt) return;
  var list = API.tickets();
  list.push({id:"T"+Date.now(), uid:id, uname:"admin", from:ME.id, text:txt, created:Date.now()});
  DB.set("tickets", list); closeSheet(); toast("Message sent");
}

function adminOrders(){
  return '<div class="field"><label>Search by order ID</label><input id="oq" oninput="filterOrders()" placeholder="WM…"></div>'+
    '<div id="olist">'+orderRows("")+'</div>';
}
function orderRows(q){
  var list = API.orders(), out = [], n = 0;
  for (var i=0;i<list.length;i++){
    if (!q || list[i].id.toLowerCase().indexOf(q.toLowerCase()) >= 0) out.push(list[i]);
  }
  if (!out.length) return '<div class="empty">No orders</div>';
  var h = "";
  for (var j=0;j<Math.min(out.length,40);j++){
    var o = out[j];
    h += '<div class="rowcard"><div class="ic">🧾</div><div class="grow"><b>'+esc(o.pname)+' x '+o.qty+'</b>'+
      '<small>'+o.id+' · '+esc(o.uname)+' · '+money(o.total)+'</small></div>'+
      '<button class="btn sm ghost" onclick="setOrder(\''+o.id+'\')">'+esc(o.status)+'</button></div>';
  }
  return h;
}
function filterOrders(){ $("#olist").innerHTML = orderRows($("#oq").value); }
function setOrder(id){
  var list = API.orders();
  for (var i=0;i<list.length;i++){
    if (list[i].id === id) list[i].status = (list[i].status === "delivered") ? "processing" : "delivered";
  }
  DB.set("orders", list); toast("Order updated"); render();
}

function adminDeps(){
  var list = API.deposits();
  if (!list.length) return '<div class="empty">No deposits</div>';
  var h = "";
  for (var i=0;i<Math.min(list.length,40);i++){
    var d = list[i], tone = d.status==="approved" ? "ok" : (d.status==="rejected" ? "bad" : "");
    h += '<div class="rowcard"><div class="ic">↓</div><div class="grow"><b>'+esc(d.uname)+' · '+money(d.amount)+'</b>'+
      '<small>'+dstr(d.created)+' · '+esc(d.status)+'</small></div>'+
      (d.status==="pending"
        ? '<button class="btn sm" onclick="depAction(\''+d.id+'\',1)">OK</button> <button class="btn sm ghost" onclick="depAction(\''+d.id+'\',0)">X</button>'
        : '<span class="badge '+tone+'">'+esc(d.status)+'</span>')+'</div>';
  }
  return h;
}
function depAction(id, ok){
  var deps = API.deposits(), d = null;
  for (var i=0;i<deps.length;i++){ if (deps[i].id === id) d = deps[i]; }
  if (!d || d.status !== "pending") return;
  if (ok){
    var us = API.users(), u = null;
    for (var j=0;j<us.length;j++){ if (us[j].id === d.uid) u = us[j]; }
    var first = true;
    for (var k=0;k<deps.length;k++){ if (deps[k].uid === d.uid && deps[k].status === "approved") first = false; }
    if (u){
      u.balance = Math.round((u.balance + d.amount)*100)/100;
      if (first && u.refBy){
        var st = API.settings();
        for (var r=0;r<us.length;r++){
          if (us[r].ref === u.refBy) us[r].balance = Math.round((us[r].balance + (st.refBonus||0))*100)/100;
        }
      }
      DB.set("users", us); refreshMe();
    }
  }
  for (var m=0;m<deps.length;m++){
    if (deps[m].id === id) deps[m].status = ok ? "approved" : "rejected";
  }
  DB.set("deposits", deps); toast(ok?"Approved":"Rejected"); render();
}
function adminWd(){
  var list = API.withdraws();
  if (!list.length) return '<div class="empty">No withdraw requests</div>';
  var h = "";
  for (var i=0;i<Math.min(list.length,40);i++){
    var d = list[i], tone = d.status==="paid" ? "ok" : (d.status==="rejected" ? "bad" : "");
    h += '<div class="rowcard"><div class="ic">↑</div><div class="grow"><b>'+esc(d.uname)+' · '+money(d.amount)+'</b>'+
      '<small>'+esc(d.method)+' · '+esc(d.address)+'</small></div>'+
      (d.status==="pending"
        ? '<button class="btn sm" onclick="wdAction(\''+d.id+'\',1)">OK</button> <button class="btn sm ghost" onclick="wdAction(\''+d.id+'\',0)">X</button>'
        : '<span class="badge '+tone+'">'+esc(d.status)+'</span>')+'</div>';
  }
  return h;
}
function wdAction(id, ok){
  var list = API.withdraws();
  for (var i=0;i<list.length;i++){
    if (list[i].id === id) list[i].status = ok ? "paid" : "rejected";
  }
  DB.set("withdraws", list); toast("Updated"); render();
}
function adminTickets(){
  var list = API.tickets();
  if (!list.length) return '<div class="empty">No messages</div>';
  var h = "";
  for (var i=list.length-1;i>=Math.max(0,list.length-40);i--){
    var m = list[i];
    h += '<div class="rowcard"><div class="ic">💬</div><div class="grow"><b>'+esc(m.uname)+'</b>'+
      '<small>'+esc(String(m.text).slice(0,90))+'</small></div>'+
      '<button class="btn sm ghost" onclick="replyTicket(\''+m.uid+'\')">Reply</button></div>';
  }
  return h;
}
function replyTicket(uid){
  openSheet('<h2 style="margin:6px 0 10px;font-size:17px">Reply</h2>'+
    '<div class="field"><textarea id="rt" rows="3"></textarea></div>'+
    '<button class="btn" onclick="sendReply(\''+uid+'\')">Send</button>');
}
function sendReply(uid){
  var txt = $("#rt").value.trim();
  if (!txt) return;
  var list = API.tickets();
  list.push({id:"T"+Date.now(), uid:uid, uname:"admin", from:ME.id, text:txt, created:Date.now()});
  DB.set("tickets", list); closeSheet(); toast("Reply sent"); render();
}
function adminSet(){
  var st = API.settings();
  return '<div class="field"><label>First top-up refer bonus (USD)</label><input id="sRef" type="number" step="0.01" value="'+(st.refBonus||0)+'"></div>'+
    '<div class="field"><label>Refer commission %</label><input id="sRefP" type="number" value="'+(st.refPercent||0)+'"></div>'+
    '<div class="field"><label>USDT TRC20 address</label><input id="sTrc" value="'+esc(st.trc20||"")+'"></div>'+
    '<div class="field"><label>Bank / card instructions</label><textarea id="sBank" rows="2">'+esc(st.banks||"")+'</textarea></div>'+
    '<div class="field"><label>Support contact</label><input id="sSup" value="'+esc(st.supportName||"")+'"></div>'+
    '<div class="field"><label>Support note</label><input id="sNote" value="'+esc(st.supportNote||"")+'"></div>'+
    '<div class="field"><label>How-to-buy video URL</label><input id="sVid" value="'+esc(st.howVideo||"")+'"></div>'+
    '<div class="field"><label>About text</label><textarea id="sAbout" rows="4">'+esc(st.about||"")+'</textarea></div>'+
    '<div class="field"><label>Channel for 10-minute product ads</label><input id="sChan" value="'+esc(st.channel||"")+'"></div>'+
    '<button class="btn" onclick="saveSet()">Save settings</button>'+
    '<p class="muted" style="margin-top:12px">Mass broadcast is sent from the bot: run /broadcast there.</p>';
}
function saveSet(){
  var st = API.settings();
  st.refBonus = Number($("#sRef").value || 0);
  st.refPercent = Number($("#sRefP").value || 0);
  st.trc20 = $("#sTrc").value.trim();
  st.banks = $("#sBank").value.trim();
  st.supportName = $("#sSup").value.trim();
  st.supportNote = $("#sNote").value.trim();
  st.howVideo = $("#sVid").value.trim();
  st.about = $("#sAbout").value.trim();
  st.channel = $("#sChan").value.trim();
  API.setSettings(st); toast("Settings saved"); render();
}

(function boot(){
  seed();
  document.getElementById("langBtn").textContent = LANG.toUpperCase();
  var p = new URLSearchParams(location.search);
  if (p.get("ref")) localStorage.setItem("wm_ref", p.get("ref"));
  refreshMe();
  if (!ME && p.get("ref")) AUTHMODE = "signup";
  go("home");
})();
</script>
